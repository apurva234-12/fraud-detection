[project]
name = "fraud-detection"
version = "0.1.0"
description = "Graph-based anomaly detection and AML risk scoring for INR transaction data (academic project, Phase 0/1: data + graph foundation)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "networkx>=3.0",
    "PyYAML>=6.0",
    "python-dateutil>=2.8",
    "pytz>=2023.3",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
